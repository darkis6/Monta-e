<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montaże VAT - Rejestr Klienci</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --vat8-color: #059669;
            --vat8-bg: #ecfdf5;
            --vat23-color: #d97706;
            --vat23-bg: #fffbeb;
            --alert-bg: #fef2f2;
            --alert-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            max-width: 100%;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        @media (min-width: 600px) {
            body {
                max-width: 600px;
                padding: 16px;
            }
        }

        header {
            margin-bottom: 16px;
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* KARTY I FORMULARZE */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            background: #f8fafc;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input:focus, textarea:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        /* WYBÓR VAT */
        .vat-selector {
            display: flex;
            gap: 10px;
        }

        .vat-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            background: #f8fafc;
        }

        .vat-option input { display: none; }

        .vat-option.v8:has(input:checked) {
            background: var(--vat8-bg);
            color: var(--vat8-color);
            border-color: var(--vat8-color);
        }

        .vat-option.v23:has(input:checked) {
            background: var(--vat23-bg);
            color: var(--vat23-color);
            border-color: var(--vat23-color);
        }

        /* PRZYCISKI */
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-cancel {
            width: 100%;
            background: var(--text-muted);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 8px;
        }

        /* SEKCJE */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* KARTY KLIENTÓW */
        .client-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
        }

        .client-card.vat-8 { border-left: 5px solid var(--vat8-color); }
        .client-card.vat-23 { border-left: 5px solid var(--vat23-color); }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .client-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .badge-8 { background: var(--vat8-bg); color: var(--vat8-color); }
        .badge-23 { background: var(--vat23-bg); color: var(--vat23-color); }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-top: 8px;
        }

        .full-width { grid-column: span 2; }

        .remind-pill {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            background: var(--vat8-bg);
            color: var(--vat8-color);
        }

        .remind-pill.overdue {
            background: var(--alert-bg);
            color: var(--alert-text);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-act {
            flex: 1;
            padding: 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .act-check { background: #dcfce7; color: #166534; }
        .act-edit { background: #e0f2fe; color: #075985; }
        .act-del { background: #fee2e2; color: #991b1b; }

        /* WIDOK TABELI EXCEL */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
            white-space: nowrap;
        }

        .excel-table th {
            background: #f1f5f9;
            color: var(--text-muted);
            padding: 10px 12px;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
        }

        .excel-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        .excel-table tr:hover td {
            background: #f8fafc;
        }

        /* DOLNE MENU NAWIGACJI (3 PRZYCISKI) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            height: 60px;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            padding: 4px;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 1.15rem;
            margin-bottom: 2px;
        }

        /* FILTRY */
        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .filter-chip {
            flex: 1;
            padding: 8px;
            font-size: 0.75rem;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body>

    <header>
        <h1>Montaże & Rejestr VAT</h1>
    </header>

    <!-- ZAKŁADKA 1: FORMULARZ KLIENTA -->
    <div id="tab-form" class="tab-content active">
        <div class="card">
            <form id="appForm">
                <input type="hidden" id="editId" value="">

                <div class="form-group">
                    <label>Klient / Firma *</label>
                    <input type="text" id="clientName" placeholder="Imię i nazwisko" required>
                </div>

                <div class="form-group">
                    <label>Stawka VAT *</label>
                    <div class="vat-selector">
                        <label class="vat-option v8">
                            <input type="radio" name="vat" value="8" checked> VAT 8%
                        </label>
                        <label class="vat-option v23">
                            <input type="radio" name="vat" value="23"> VAT 23%
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adres montażu</label>
                    <input type="text" id="address" placeholder="Ulica, numer, miasto">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nr transakcji</label>
                        <input type="text" id="transNo" placeholder="TR/...">
                    </div>
                    <div class="form-group">
                        <label>Nr umowy</label>
                        <input type="text" id="contractNo" placeholder="UM/...">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Data pomiaru</label>
                        <input type="date" id="measureDate">
                    </div>
                    <div class="form-group">
                        <label>Data zamówienia *</label>
                        <input type="date" id="orderDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Montażysta</label>
                    <input type="text" id="fitter" placeholder="Imię / Ekipa">
                </div>

                <div class="form-group">
                    <label>Uwagi</label>
                    <textarea id="notes" rows="2" placeholder="Dodatkowe informacje..."></textarea>
                </div>

                <button type="submit" id="saveBtn" class="btn-primary">Zapisz Klienta</button>
                <button type="button" id="cancelBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Anuluj edycję</button>
            </form>
        </div>
    </div>

    <!-- ZAKŁADKA 2: LISTA KLIENTÓW -->
    <div id="tab-list" class="tab-content">
        <div class="filter-bar">
            <button class="filter-chip active" onclick="applyFilter('all', this)">Wszyscy</button>
            <button class="filter-chip" onclick="applyFilter('8', this)">VAT 8%</button>
            <button class="filter-chip" onclick="applyFilter('23', this)">VAT 23%</button>
            <button class="filter-chip" onclick="applyFilter('pending', this)">Do weryfikacji</button>
        </div>

        <div id="cardsContainer"></div>
    </div>

    <!-- ZAKŁADKA 3: TABELA EXCEL -->
    <div id="tab-excel" class="tab-content">
        <div class="table-responsive">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Klient</th>
                        <th>VAT</th>
                        <th>Adres</th>
                        <th>Transakcja</th>
                        <th>Umowa</th>
                        <th>Pomiar</th>
                        <th>Zamówienie</th>
                        <th>Weryfikacja (5tyg.)</th>
                        <th>Montażysta</th>
                        <th>Uwagi</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="excelTableBody">
                    <!-- Wiersze generowane dynamicznie -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- DOLNY PASEK NAWIGACJI -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="showTab('form', this)">
            <span class="nav-icon">➕</span>
            <span>Nowy Klient</span>
        </button>
        <button class="nav-btn" onclick="showTab('list', this)">
            <span class="nav-icon">📋</span>
            <span>Lista</span>
        </button>
        <button class="nav-btn" onclick="showTab('excel', this)">
            <span class="nav-icon">📊</span>
            <span>Tabela</span>
        </button>
    </nav>

    <script>
        document.getElementById('orderDate').valueAsDate = new Date();

        let database = JSON.parse(localStorage.getItem('app_clients_db')) || [];
        let activeFilter = 'all';

        function saveToStorage() {
            localStorage.setItem('app_clients_db', JSON.stringify(database));
        }

        function showTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            if (btn) btn.classList.add('active');

            if (tabName === 'list') {
                renderList();
            } else if (tabName === 'excel') {
                renderExcelTable();
            }
        }

        document.getElementById('appForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const editId = document.getElementById('editId').value;
            const clientName = document.getElementById('clientName').value;
            const vat = document.querySelector('input[name="vat"]:checked').value;
            const address = document.getElementById('address').value;
            const transNo = document.getElementById('transNo').value;
            const contractNo = document.getElementById('contractNo').value;
            const measureDate = document.getElementById('measureDate').value;
            const orderDateVal = document.getElementById('orderDate').value;
            const fitter = document.getElementById('fitter').value;
            const notes = document.getElementById('notes').value;

            const orderDateObj = new Date(orderDateVal);
            const remindDateObj = new Date(orderDateObj);
            remindDateObj.setDate(remindDateObj.getDate() + 35);
            const remindDateVal = remindDateObj.toISOString().split('T')[0];

            const record = {
                id: editId ? Number(editId) : Date.now(),
                clientName,
                vat,
                address,
                transNo,
                contractNo,
                measureDate,
                orderDate: orderDateVal,
                remindDate: remindDateVal,
                fitter,
                notes,
                done: editId ? (database.find(item => item.id == Number(editId))?.done || false) : false
            };

            if (editId) {
                database = database.map(item => item.id === Number(editId) ? record : item);
            } else {
                database.unshift(record);
            }

            saveToStorage();
            resetForm();
            showTab('list', document.querySelectorAll('.nav-btn')[1]);
        });

        function resetForm() {
            document.getElementById('appForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('saveBtn').innerText = 'Zapisz Klienta';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('orderDate').valueAsDate = new Date();
        }

        function editRecord(id) {
            const item = database.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('clientName').value = item.clientName;
            document.querySelector(`input[name="vat"][value="${item.vat}"]`).checked = true;
            document.getElementById('address').value = item.address || '';
            document.getElementById('transNo').value = item.transNo || '';
            document.getElementById('contractNo').value = item.contractNo || '';
            document.getElementById('measureDate').value = item.measureDate || '';
            document.getElementById('orderDate').value = item.orderDate || '';
            document.getElementById('fitter').value = item.fitter || '';
            document.getElementById('notes').value = item.notes || '';

            document.getElementById('saveBtn').innerText = 'Zapisz Zmiany';
            document.getElementById('cancelBtn').style.display = 'block';

            showTab('form', document.querySelectorAll('.nav-btn')[0]);
        }

        function toggleDone(id) {
            database = database.map(item => item.id === id ? {...item, done: !item.done} : item);
            saveToStorage();
            renderList();
            if (document.getElementById('tab-excel').classList.contains('active')) {
                renderExcelTable();
            }
        }

        function deleteRecord(id) {
            if (confirm("Usunąć tego klienta?")) {
                database = database.filter(item => item.id !== id);
                saveToStorage();
                renderList();
                if (document.getElementById('tab-excel').classList.contains('active')) {
                    renderExcelTable();
                }
            }
        }

        function applyFilter(filterType, btn) {
            activeFilter = filterType;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderList();
        }

        function renderList() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            const filtered = database.filter(item => {
                if (activeFilter === '8') return item.vat === '8';
                if (activeFilter === '23') return item.vat === '23';
                if (activeFilter === 'pending') return !item.done;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px;">Brak zapisanych klientów.</p>';
                return;
            }

            filtered.forEach(item => {
                const isOverdue = !item.done && item.remindDate <= today;
                container.innerHTML += `
                    <div class="client-card vat-${item.vat}">
                        <div class="card-head">
                            <span class="client-title">${item.clientName}</span>
                            <span class="badge badge-${item.vat}">VAT ${item.vat}%</span>
                        </div>

                        <div class="info-grid">
                            ${item.address ? `<div class="full-width">📍 <strong>Adres:</strong> ${item.address}</div>` : ''}
                            ${item.transNo ? `<div>🔢 <strong>Transakcja:</strong> ${item.transNo}</div>` : ''}
                            ${item.contractNo ? `<div>📄 <strong>Umowa:</strong> ${item.contractNo}</div>` : ''}
                            ${item.measureDate ? `<div>📐 <strong>Pomiar:</strong> ${item.measureDate}</div>` : ''}
                            <div>📅 <strong>Zamówienie:</strong> ${item.orderDate}</div>
                            ${item.fitter ? `<div class="full-width">👷 <strong>Montażysta:</strong> ${item.fitter}</div>` : ''}
                            ${item.notes ? `<div class="full-width">📝 <strong>Uwagi:</strong> ${item.notes}</div>` : ''}
                        </div>

                        <div class="remind-pill ${isOverdue ? 'overdue' : ''}">
                            <span>⏰ Weryfikacja (5 tyg.): <strong>${item.remindDate}</strong></span>
                            <span>${item.done ? '✓ Gotowe' : (isOverdue ? '⚠️ SPRAWDŹ!' : 'W trakcie')}</span>
                        </div>

                        <div class="card-actions">
                            <button class="btn-act act-check" onclick="toggleDone(${item.id})">
                                ${item.done ? '✓ Zrobione' : '◯ Odhacz'}
                            </button>
                            <button class="btn-act act-edit" onclick="editRecord(${item.id})">Edytuj</button>
                            <button class="btn-act act-del" onclick="deleteRecord(${item.id})">Usuń</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderExcelTable() {
            const tbody = document.getElementById('excelTableBody');
            tbody.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            if (database.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" style="text-align:center; color: var(--text-muted); padding: 20px;">Brak danych w tabeli.</td></tr>`;
                return;
            }

            database.forEach(item => {
                const isOverdue = !item.done && item.remindDate <= today;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span style="font-weight:bold; color:${item.done ? '#166534' : (isOverdue ? '#991b1b' : '#d97706')}">${item.done ? '✓ Gotowe' : (isOverdue ? '⚠️ PILNE' : 'W trakcie')}</span></td>
                    <td style="font-weight:bold;">${item.clientName}</td>
                    <td><span class="badge badge-${item.vat}">VAT ${item.vat}%</span></td>
                    <td>${item.address || '-'}</td>
                    <td>${item.transNo || '-'}</td>
                    <td>${item.contractNo || '-'}</td>
                    <td>${item.measureDate || '-'}</td>
                    <td>${item.orderDate}</td>
                    <td style="${isOverdue ? 'color:#991b1b; font-weight:bold;' : ''}">${item.remindDate}</td>
                    <td>${item.fitter || '-'}</td>
                    <td>${item.notes || '-'}</td>
                    <td>
                        <button class="btn-act act-check" style="padding:4px 8px; margin-right:4px;" onclick="toggleDone(${item.id})">Odhacz</button>
                        <button class="btn-act act-edit" style="padding:4px 8px; margin-right:4px;" onclick="editRecord(${item.id})">Edytuj</button>
                        <button class="btn-act act-del" style="padding:4px 8px;" onclick="deleteRecord(${item.id})">Usuń</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderList();
    </script>
</body>
</html>
