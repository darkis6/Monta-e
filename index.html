<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestr Klienci & Montaże VAT</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1f2937;
            --border: #e5e7eb;
            --vat-8: #059669;
            --vat-23: #d97706;
            --status-wait: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.3rem;
            color: #1e293b;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #4b5563;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .radio-label.vat8-label { color: var(--vat-8); }
        .radio-label.vat23-label { color: var(--vat-23); }

        .radio-label:has(input:checked) {
            background-color: #f0fdf4;
            border-color: var(--vat-8);
        }

        .radio-label.vat23-label:has(input:checked) {
            background-color: #fffbeb;
            border-color: var(--vat-23);
        }

        .radio-label input { display: none; }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-cancel {
            background-color: #6b7280;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 8px;
            padding: 8px;
            border-radius: 8px;
        }

        /* Dolna nawigacja */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 4px;
            max-width: 600px;
            margin: 0 auto;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8rem;
            color: #6b7280;
            cursor: pointer;
            flex: 1;
            padding: 6px;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: bold;
        }

        .nav-icon {
            font-size: 1.3rem;
            margin-bottom: 2px;
        }

        /* Sekcje */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Karty Klientów */
        .entry-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border-left: 5px solid var(--border);
        }

        .entry-card.vat-8 { border-left-color: var(--vat-8); }
        .entry-card.vat-23 { border-left-color: var(--vat-23); }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .client-name {
            font-weight: bold;
            font-size: 1.05rem;
            color: #1e293b;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .badge-8 { background: #d1fae5; color: var(--vat-8); }
        .badge-23 { background: #fef3c7; color: var(--vat-23); }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 0.8rem;
            color: #4b5563;
            margin-top: 8px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 6px;
        }

        .details-full {
            grid-column: span 2;
        }

        .remind-box {
            margin-top: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            background: #fef2f2;
            color: #991b1b;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .remind-box.ok {
            background: #f0fdf4;
            color: #166534;
        }

        .entry-actions {
            margin-top: 10px;
            display: flex;
            gap: 6px;
        }

        .action-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-check { background: #dcfce7; color: #15803d; }
        .btn-edit { background: #e0f2fe; color: #0369a1; }
