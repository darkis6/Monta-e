<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestr Klienci & Montaże VAT</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text: #1f2937;
            --border: #e5e7eb;
            --vat-8: #059669;
            --vat-23: #d97706;
            --status-wait: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.3rem;
            color: #1e293b;
        }

        .card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #4b5563;
        }

        input, select, textarea, button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            gap: 10px;
        }

        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .radio-label.vat8-label { color: var(--vat-8); }
        .radio-label.vat23-label { color: var(--vat-23); }

        .radio-label:has(input:checked) {
            background-color: #f0fdf4;
            border-color: var(--vat-8);
        }

        .radio-label.vat23-label:has(input:checked) {
            background-color: #fffbeb;
            border-color: var(--vat-23);
        }

        .radio-label input { display: none; }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            padding: 12px;
            border-radius: 8px;
        }

        .btn-cancel {
            background-color: #6b7280;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            margin-top: 8px;
            padding: 8px;
            border-radius: 8px;
        }

        /* Nawigacja Dolna */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            max-width: 600px;
            margin: 0 auto;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.75rem;
            color: #6b7280;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: bold;
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        /* Sekcje */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Karty Klientów */
        .entry-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border-left: 5px solid var(--border);
        }

        .entry-card.vat-8 { border-left-color: var(--vat-8); }
        .entry-card.vat-23 { border-left-color: var(--vat-23); }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .client-name {
            font-weight: bold;
            font-size: 1.05rem;
            color: #1e293b;
        }

        .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .badge-8 { background: #d1fae5; color: var(--vat-8); }
        .badge-23 { background: #fef3c7; color: var(--vat-23); }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 0.8rem;
            color: #4b5563;
            margin-top: 8px;
            background: #f8fafc;
            padding: 8px;
            border-radius: 6px;
        }

        .details-full {
            grid-column: span 2;
        }

        .remind-box {
            margin-top: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            background: #fef2f2;
            color: #991b1b;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .remind-box.ok {
            background: #f0fdf4;
            color: #166534;
        }

        .entry-actions {
            margin-top: 10px;
            display: flex;
            gap: 6px;
        }

        .action-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-check { background: #dcfce7; color: #15803d; }
        .btn-edit { background: #e0f2fe; color: #0369a1; }
        .btn-delete { background: #fee2e2; color: #b91c1c; }

        .filters {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .filter-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.75rem;
            background: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        .calendar-box {
            text-align: center;
            margin-bottom: 12px;
        }
        
        .calendar-box input[type="date"] {
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            background: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rejestr Klienci & Montaże</h1>
    </header>

    <!-- EKRAN 1: FORMULARZ -->
    <div id="section-form" class="section active">
        <div class="card">
            <form id="clientForm">
                <input type="hidden" id="editId" value="">

                <div class="form-group">
                    <label>Imię i Nazwisko / Nazwa Klienta *</label>
                    <input type="text" id="clientName" placeholder="np. Jan Kowalski" required>
                </div>

                <div class="form-group">
                    <label>Stawka VAT *</label>
                    <div class="radio-group">
                        <label class="radio-label vat8-label">
                            <input type="radio" name="vatRate" value="8" checked> VAT 8%
                        </label>
                        <label class="radio-label vat23-label">
                            <input type="radio" name="vatRate" value="23"> VAT 23%
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adres zamieszkania / Montażu</label>
                    <input type="text" id="address" placeholder="np. ul. Lipowa 12, Warszawa">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nr transakcji</label>
                        <input type="text" id="transactionNo" placeholder="np. TR/102/2026">
                    </div>
                    <div class="form-group">
                        <label>Nr umowy</label>
                        <input type="text" id="contractNo" placeholder="np. UM/45/2026">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Data pomiaru</label>
                        <input type="date" id="measureDate">
                    </div>
                    <div class="form-group">
                        <label>Data zamówienia *</label>
                        <input type="date" id="orderDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Montażysta</label>
                    <input type="text" id="fitter" placeholder="np. Pan Piotr / Ekipa 2">
                </div>

                <div class="form-group">
                    <label>Dodatkowe uwagi</label>
                    <textarea id="notes" rows="2" placeholder="Opcjonalne szczegóły..."></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Zapisz Klienta (+Przypomnienie 5 tyg.)</button>
                <button type="button" id="cancelBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Anuluj edycję</button>
            </form>
        </div>
    </div>

    <!-- EKRAN 2: LISTA -->
    <div id="section-list" class="section">
        <div class="filters">
            <button class="filter-btn active" onclick="setFilter('all', this)">Wszyscy</button>
            <button class="filter-btn" onclick="setFilter('8', this)">VAT 8%</button>
            <button class="filter-btn" onclick="setFilter('23', this)">VAT 23%</button>
            <button class="filter-btn" onclick="setFilter('pending', this)">Do sprawdzenia</button>
        </div>

        <div id="clientsList"></div>
    </div>

    <!-- EKRAN 3: KALENDARZ -->
    <div id="section-calendar" class="section">
        <div class="card">
            <div class="calendar-box">
                <label>Wybierz dzień z kalendarza, aby sprawdzić zdarzenia:</label>
                <input type="date" id="calendarPicker" onchange="renderCalendarView()">
            </div>
        </div>
        <div id="calendarResults"></div>
    </div>

    <!-- DOLNE MENU NAWIGACYJNE -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchSection('form', this)">
            <span class="nav-icon">➕</span>
            <span>Nowy Klient</span>
        </button>
        <button class="nav-item" onclick="switchSection('list', this)">
            <span class="nav-icon">📋</span>
            <span>Lista</span>
        </button>
        <button class="nav-item" onclick="switchSection('calendar', this)">
            <span class="nav-icon">📅</span>
            <span>Kalendarz</span>
        </button>
    </nav>

    <script>
        document.getElementById('orderDate').valueAsDate = new Date();
        document.getElementById('calendarPicker').valueAsDate = new Date();

        let clients = JSON.parse(localStorage.getItem('vat_clients_data')) || [];
        let currentFilter = 'all';

        function switchSection(sec, btnElement) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            
            document.getElementById('section-' + sec).classList.add('active');
            if (btnElement) {
                btnElement.classList.add('active');
            }

            if (sec === 'list') {
                renderClients();
            } else if (sec === 'calendar') {
                renderCalendarView();
            }
        }

        document.getElementById('clientForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const editId = document.getElementById('editId').value;
            const clientName = document.getElementById('clientName').value;
            const vatRate = document.querySelector('input[name="vatRate"]:checked').value;
            const address = document.getElementById('address').value;
            const transactionNo = document.getElementById('transactionNo').value;
            const contractNo = document.getElementById('contractNo').value;
            const measureDate = document.getElementById('measureDate').value;
            const orderDateVal = document.getElementById('orderDate').value;
            const fitter = document.getElementById('fitter').value;
            const notes = document.getElementById('notes').value;

            const orderDate = new Date(orderDateVal);
            const remindDate = new Date(orderDate);
            remindDate.setDate(remindDate.getDate() + 35);

            const clientData = {
                id: editId ? Number(editId) : Date.now(),
                clientName,
                vatRate,
                address,
                transactionNo,
                contractNo,
                measureDate,
                orderDate: orderDateVal,
                remindDate: remindDate.toISOString().split('T')[0],
                fitter,
                notes,
                checked: editId ? (clients.find(c => c.id == editId)?.checked || false) : false
            };

            if (editId) {
                clients = clients.map(c => c.id === Number(editId) ? clientData : c);
            } else {
                clients.unshift(clientData);
            }

            saveData();
            resetForm();
            
            // Przełącz na zakładkę listy programowo
            const listNavBtn = document.querySelectorAll('.nav-item')[1];
            switchSection('list', listNavBtn);
        });

        function saveData() {
            localStorage.setItem('vat_clients_data', JSON.stringify(clients));
        }

        function resetForm() {
            document.getElementById('clientForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('submitBtn').innerText = 'Zapisz Klienta (+Przypomnienie 5 tyg.)';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('orderDate').valueAsDate = new Date();
        }

        function editClient(id) {
            const item = clients.find(c => c.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('clientName').value = item.clientName;
            document.querySelector(`input[name="vatRate"][value="${item.vatRate}"]`).checked = true;
            document.getElementById('address').value = item.address || '';
            document.getElementById('transactionNo').value = item.transactionNo || '';
            document.getElementById('contractNo').value = item.contractNo || '';
            document.getElementById('measureDate').value = item.measureDate || '';
            document.getElementById('orderDate').value = item.orderDate || '';
            document.getElementById('fitter').value = item.fitter || '';
            document.getElementById('notes').value = item.notes || '';

            document.getElementById('submitBtn').innerText = 'Zapisz Zmiany';
            document.getElementById('cancelBtn').style.display = 'block';

            const formNavBtn = document.querySelectorAll('.nav-item')[0];
            switchSection('form', formNavBtn);
        }

        function toggleCheck(id) {
            clients = clients.map(c => c.id === id ? {...c, checked: !c.checked} : c);
            saveData();
            renderClients();
            if(document.getElementById('section-calendar').classList.contains('active')) {
                renderCalendarView();
            }
        }

        function deleteClient(id) {
            if (confirm("Czy na pewno chcesz usunąć dane tego klienta?")) {
                clients = clients.filter(c => c.id !== id);
                saveData();
                renderClients();
                if(document.getElementById('section-calendar').classList.contains('active')) {
                    renderCalendarView();
                }
            }
        }

        function setFilter(filter, btnElement) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            }
            renderClients();
        }

        function renderClients() {
            const listEl = document.getElementById('clientsList');
            if (!listEl) return;
            listEl.innerHTML = '';
            const todayStr = new Date().toISOString().split('T')[0];

            const filtered = clients.filter(item => {
                if (currentFilter === '8') return item.vatRate === '8';
                if (currentFilter === '23') return item.vatRate === '23';
                if (currentFilter === 'pending') return !item.checked;
                return true;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<p style="text-align:center; color:#9ca3af; padding: 20px;">Brak wpisów.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = createClientCard(item, todayStr);
                listEl.appendChild(card);
            });
        }

        function renderCalendarView() {
            const picker = document.getElementById('calendarPicker');
            const container = document.getElementById('calendarResults');
            if (!picker || !container) return;

            const selectedDate = picker.value;
            container.innerHTML = '';

            const todayStr = new Date().toISOString().split('T')[0];

            const matched = clients.filter(item => 
                item.orderDate === selectedDate || 
                item.measureDate === selectedDate || 
                item.remindDate === selectedDate
            );

            if (matched.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#9ca3af; padding: 20px;">Brak zdarzeń dla wybranego dnia (${selectedDate}).</p>`;
                return;
            }

            const title = document.createElement('h3');
            title.style.fontSize = '0.95rem';
            title.style.marginBottom = '10px';
            title.style.color = '#4b5563';
            title.innerText = `Zdarzenia w dniu ${selectedDate} (${matched.length}):`;
            container.appendChild(title);

            matched.forEach(item => {
                const card = createClientCard(item, todayStr);
                container.appendChild(card);
            });
        }

        function createClientCard(item, todayStr) {
            const card = document.createElement('div');
            card.className = `entry-card vat-${item.vatRate}`;
            const isDue = !item.checked && item.remindDate <= todayStr;

            card.innerHTML = `
                <div class="entry-header">
                    <span class="client-name">${item.clientName}</span>
                    <span class="badge badge-${item.vatRate}">VAT ${item.vatRate}%</span>
                </div>

                <div class="details-grid">
                    ${item.address ? `<div class="details-full">📍 <strong>Adres:</strong> ${item.address}</div>` : ''}
                    ${item.transactionNo ? `<div>🔢 <strong>Nr transakcji:</strong> ${item.transactionNo}</div>` : ''}
                    ${item.contractNo ? `<div>📄 <strong>Nr umowy:</strong> ${item.contractNo}</div>` : ''}
                    ${item.measureDate ? `<div>📐 <strong>Pomiar:</strong> ${item.measureDate}</div>` : ''}
                    <div>📅 <strong>Zamówienie:</strong> ${item.orderDate}</div>
                    ${item.fitter ? `<div class="details-full">👷 <strong>Montażysta:</strong> ${item.fitter}</div>` : ''}
                    ${item.notes ? `<div class="details-full">📝 <strong>Uwagi:</strong> ${item.notes}</div>` : ''}
                </div>

                <div class="remind-box ${item.checked ? 'ok' : (isDue ? '' : 'ok')}">
                    <span>⏰ Przypomnienie (5 tyg.): <strong>${item.remindDate}</strong></span>
                    <span>${item.checked ? '✓ Gotowe' : (isDue ? '⚠️ SPRAWDŹ!' : 'W trakcie')}</span>
                </div>

                <div class="entry-actions">
                    <button class="action-btn btn-check" onclick="toggleCheck(${item.id})">
                        ${item.checked ? '✓ Sprawdzone' : '◯ Odhacz'}
                    </button>
                    <button class="action-btn btn-edit" onclick="editClient(${item.id})">Edytuj</button>
                    <button class="action-btn btn-delete" onclick="deleteClient(${item.id})">Usuń</button>
                </div>
            `;
            return card;
        }

        renderClients();
    </script>
</body>
</html>
