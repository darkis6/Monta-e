<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montaże VAT - Rejestr Klienci</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --vat8-color: #059669;
            --vat8-bg: #ecfdf5;
            --vat23-color: #d97706;
            --vat23-bg: #fffbeb;
            --alert-bg: #fef2f2;
            --alert-text: #991b1b;
            --input-bg: #f8fafc;
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --vat8-color: #34d399;
            --vat8-bg: rgba(5, 150, 105, 0.15);
            --vat23-color: #fbbf24;
            --vat23-bg: rgba(217, 119, 6, 0.15);
            --alert-bg: rgba(153, 27, 27, 0.2);
            --alert-text: #f87171;
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 12px;
            max-width: 100%;
            margin: 0 auto;
            padding-bottom: 80px;
            transition: background-color 0.2s, color 0.2s;
        }

        @media (min-width: 600px) {
            body {
                max-width: 600px;
                padding: 16px;
            }
        }

        header {
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .theme-toggle-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* KARTY I FORMULARZE */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            background: var(--input-bg);
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* ZARZĄDZANIE LISTAMI ROZWIJANYMI */
        .manager-box {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            margin-top: 6px;
        }

        .tags-list-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            max-height: 90px;
            overflow-y: auto;
        }

        .tag-pill {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
        }

        .tag-pill button {
            background: none;
            border: none;
            color: var(--alert-text);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            padding: 0;
            width: auto;
        }

        .inline-add-row {
            display: flex;
            gap: 6px;
        }

        .inline-add-row input {
            padding: 8px 10px;
            font-size: 0.85rem;
        }

        .btn-small {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* WYBÓR VAT */
        .vat-selector {
            display: flex;
            gap: 10px;
        }

        .vat-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            background: var(--input-bg);
            color: var(--text-main);
        }

        .vat-option input { display: none; }

        .vat-option.v8:has(input:checked) {
            background: var(--vat8-bg);
            color: var(--vat8-color);
            border-color: var(--vat8-color);
        }

        .vat-option.v23:has(input:checked) {
            background: var(--vat23-bg);
            color: var(--vat23-color);
            border-color: var(--vat23-color);
        }

        /* PRZYCISKI */
        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 6px;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-cancel {
            width: 100%;
            background: var(--text-muted);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 8px;
        }

        /* SEKCJE */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* KARTY KLIENTÓW */
        .client-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            position: relative;
        }

        .client-card.vat-8 { border-left: 5px solid var(--vat8-color); }
        .client-card.vat-23 { border-left: 5px solid var(--vat23-color); }

        .card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .client-title {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
        }

        .badge-8 { background: var(--vat8-bg); color: var(--vat8-color); }
        .badge-23 { background: var(--vat23-bg); color: var(--vat23-color); }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-top: 8px;
            color: var(--text-muted);
        }

        .info-grid strong {
            color: var(--text-main);
        }

        .full-width { grid-column: span 2; }

        .remind-pill {
            margin-top: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            background: var(--vat8-bg);
            color: var(--vat8-color);
        }

        .remind-pill.overdue {
            background: var(--alert-bg);
            color: var(--alert-text);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-act {
            flex: 1;
            padding: 8px;
            font-size: 0.75rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .act-check { background: rgba(5, 150, 105, 0.15); color: var(--vat8-color); }
        .act-edit { background: rgba(79, 70, 229, 0.15); color: var(--primary); }
        .act-del { background: var(--alert-bg); color: var(--alert-text); }

        /* WIDOK TABELI EXCEL */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
        }

        .excel-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
            white-space: nowrap;
        }

        .excel-table th {
            background: var(--input-bg);
            color: var(--text-muted);
            padding: 10px 12px;
            font-weight: 700;
            border-bottom: 2px solid var(--border);
            text-transform: uppercase;
        }

        .excel-table td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }

        .excel-table tr:hover td {
            background: var(--input-bg);
        }

        /* WIDOK KALENDARZA W KRATKĘ */
        .cal-toggle-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .cal-toggle-btn {
            flex: 1;
            padding: 8px;
            font-size: 0.75rem;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .cal-toggle-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .grid-calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .grid-calendar-header h2 {
            font-size: 1rem;
            font-weight: 700;
        }

        .cal-nav-btn {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .grid-calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .grid-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .grid-day {
            aspect-ratio: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            color: var(--text-main);
        }

        .grid-day.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .grid-day.today {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            font-weight: 800;
        }

        .grid-day.selected {
            background: var(--primary);
            color: white;
        }

        .day-dots {
            display: flex;
            gap: 2px;
            margin-top: 2px;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
        }

        .dot-8 { background: var(--vat8-color); }
        .dot-23 { background: var(--vat23-color); }

        /* DOLNY PASEK NAWIGACJI */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            height: 60px;
            z-index: 100;
        }

        .nav-btn {
            flex: 1;
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            padding: 2px;
        }

        .nav-btn.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        /* FILTRY */
        .filter-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .filter-chip {
            flex: 1;
            padding: 8px;
            font-size: 0.75rem;
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .filter-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>
<body data-theme="light">

    <header>
        <h1>Montaże & Rejestr VAT</h1>
        <button class="theme-toggle-btn" onclick="toggleTheme()">
            <span id="themeIcon">🌙</span> <span id="themeText">Tryb ciemny</span>
        </button>
    </header>

    <!-- ZAKŁADKA 1: FORMULARZ KLIENTA -->
    <div id="tab-form" class="tab-content active">
        <div class="card">
            <form id="appForm">
                <input type="hidden" id="editId" value="">

                <div class="form-group">
                    <label>Klient / Firma *</label>
                    <input type="text" id="clientName" placeholder="Imię i nazwisko" required>
                </div>

                <div class="form-group">
                    <label>Stawka VAT *</label>
                    <div class="vat-selector">
                        <label class="vat-option v8">
                            <input type="radio" name="vat" value="8" checked> VAT 8%
                        </label>
                        <label class="vat-option v23">
                            <input type="radio" name="vat" value="23"> VAT 23%
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Rodzaj montażu</label>
                    <select id="assemblyType"></select>
                    <div class="manager-box">
                        <label style="font-size: 0.7rem; margin-bottom: 4px;">Zarządzaj rodzajami:</label>
                        <div id="assemblyTagsList" class="tags-list-items"></div>
                        <div class="inline-add-row">
                            <input type="text" id="newAssemblyInput" placeholder="Nowy rodzaj...">
                            <button type="button" class="btn-small" onclick="addNewAssemblyType()">Dodaj</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adres montażu</label>
                    <input type="text" id="address" placeholder="Ulica, numer, miasto">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Nr transakcji</label>
                        <input type="text" id="transNo" placeholder="TR/...">
                    </div>
                    <div class="form-group">
                        <label>Nr umowy</label>
                        <input type="text" id="contractNo" placeholder="UM/...">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Data pomiaru</label>
                        <input type="date" id="measureDate">
                    </div>
                    <div class="form-group">
                        <label>Data zamówienia *</label>
                        <input type="date" id="orderDate" required onchange="autoCalculateRemindDate()">
                    </div>
                </div>

                <div class="form-group">
                    <label>Data powiadomienia (np. 5 tyg.) *</label>
                    <input type="date" id="remindDate" required>
                </div>

                <div class="form-group">
                    <label>Montażysta</label>
                    <select id="fitter"></select>
                    <div class="manager-box">
                        <label style="font-size: 0.7rem; margin-bottom: 4px;">Zarządzaj montażystami:</label>
                        <div id="fitterTagsList" class="tags-list-items"></div>
                        <div class="inline-add-row">
                            <input type="text" id="newFitterInput" placeholder="Nowy montażysta...">
                            <button type="button" class="btn-small" onclick="addNewFitter()">Dodaj</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Uwagi</label>
                    <textarea id="notes" rows="2" placeholder="Dodatkowe informacje..."></textarea>
                </div>

                <button type="submit" id="saveBtn" class="btn-primary">Zapisz Klienta</button>
                <button type="button" id="cancelBtn" class="btn-cancel" style="display:none;" onclick="resetForm()">Anuluj edycję</button>
            </form>
        </div>
    </div>

    <!-- ZAKŁADKA 2: LISTA KLIENTÓW -->
    <div id="tab-list" class="tab-content">
        <div class="filter-bar">
            <button class="filter-chip active" onclick="applyFilter('all', this)">Wszyscy</button>
            <button class="filter-chip" onclick="applyFilter('8', this)">VAT 8%</button>
            <button class="filter-chip" onclick="applyFilter('23', this)">VAT 23%</button>
            <button class="filter-chip" onclick="applyFilter('pending', this)">Do weryfikacji</button>
        </div>

        <div id="cardsContainer"></div>
    </div>

    <!-- ZAKŁADKA 3: TABELA EXCEL -->
    <div id="tab-excel" class="tab-content">
        <div class="table-responsive">
            <table class="excel-table">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Klient</th>
                        <th>VAT</th>
                        <th>Rodzaj montażu</th>
                        <th>Adres</th>
                        <th>Transakcja</th>
                        <th>Umowa</th>
                        <th>Pomiar</th>
                        <th>Zamówienie</th>
                        <th>Powiadomienie</th>
                        <th>Montażysta</th>
                        <th>Uwagi</th>
                        <th>Akcje</th>
                    </tr>
                </thead>
                <tbody id="excelTableBody">
                    <!-- Wiersze generowane dynamicznie -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ZAKŁADKA 4: KALENDARZ -->
    <div id="tab-calendar" class="tab-content">
        <div class="cal-toggle-bar">
            <button class="cal-toggle-btn active" onclick="switchCalView('grid', this)">📆 Siatka miesiąca</button>
            <button class="cal-toggle-btn" onclick="switchCalView('single', this)">🔍 Wybór dnia</button>
        </div>

        <!-- WIDOK 1: KLASYCZNA SIATKA (KRATKA) -->
        <div id="calViewGrid" class="card">
            <div class="grid-calendar-header">
                <button class="cal-nav-btn" onclick="changeMonth(-1)">◄</button>
                <h2 id="currentMonthYear">-- ----</h2>
                <button class="cal-nav-btn" onclick="changeMonth(1)">►</button>
            </div>

            <div class="grid-calendar-days">
                <div>Pn</div><div>Wt</div><div>Śr</div><div>Cz</div><div>Pt</div><div>Sob</div><div>Nd</div>
            </div>

            <div id="gridCalendarDaysContainer" class="grid-calendar-grid"></div>
        </div>

        <!-- WIDOK 2: WYBÓR DATA PICKEREREM -->
        <div id="calViewSingle" class="card" style="display:none;">
            <div class="form-group" style="margin-bottom:0;">
                <label>Wybierz konkretny dzień:</label>
                <input type="date" id="calendarPicker" onchange="renderCalendarEvents(this.value)">
            </div>
        </div>

        <div id="calendarEventsContainer"></div>
    </div>

    <!-- DOLNY PASEK NAWIGACJI -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="showTab('form', this)">
            <span class="nav-icon">➕</span>
            <span>Nowy</span>
        </button>
        <button class="nav-btn" onclick="showTab('list', this)">
            <span class="nav-icon">📋</span>
            <span>Lista</span>
        </button>
        <button class="nav-btn" onclick="showTab('excel', this)">
            <span class="nav-icon">📊</span>
            <span>Tabela</span>
        </button>
        <button class="nav-btn" onclick="showTab('calendar', this)">
            <span class="nav-icon">📅</span>
            <span>Kalendarz</span>
        </button>
    </nav>

    <script>
        // Inicjalizacja trybu ciemnego
        const savedTheme = localStorage.getItem('app_theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        updateThemeButton(savedTheme);

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('app_theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (theme === 'dark') {
                icon.innerText = '☀️';
                text.innerText = 'Tryb jasny';
            } else {
                icon.innerText = '🌙';
                text.innerText = 'Tryb ciemny';
            }
        }

        // Automatyczne ustawienie daty zamówienia na dzisiaj oraz wyliczenie domyślnych 35 dni
        const todayObj = new Date();
        document.getElementById('orderDate').valueAsDate = todayObj;
        const defaultRemind = new Date(todayObj);
        defaultRemind.setDate(defaultRemind.getDate() + 35);
        document.getElementById('remindDate').value = defaultRemind.toISOString().split('T')[0];
        document.getElementById('calendarPicker').valueAsDate = todayObj;

        function autoCalculateRemindDate() {
            const orderDateVal = document.getElementById('orderDate').value;
            if (!orderDateVal) return;
            const orderDateObj = new Date(orderDateVal);
            const remindDateObj = new Date(orderDateObj);
            remindDateObj.setDate(remindDateObj.getDate() + 35);
            document.getElementById('remindDate').value = remindDateObj.toISOString().split('T')[0];
        }

        let database = JSON.parse(localStorage.getItem('app_clients_db')) || [];
        let assemblyTypes = JSON.parse(localStorage.getItem('app_assembly_types')) || ['Okna', 'Drzwi', 'Rolety', 'Bramy', 'Żaluzje'];
        let fittersList = JSON.parse(localStorage.getItem('app_fitters_list')) || ['Ekipa 1', 'Ekipa 2', 'Pan Piotr', 'Pan Marek'];
        let activeFilter = 'all';

        let currentCalDate = new Date();
        let selectedCalDateStr = new Date().toISOString().split('T')[0];

        function saveToStorage() {
            localStorage.setItem('app_clients_db', JSON.stringify(database));
            localStorage.setItem('app_assembly_types', JSON.stringify(assemblyTypes));
            localStorage.setItem('app_fitters_list', JSON.stringify(fittersList));
        }

        // --- ZARZĄDZANIE RODZAJAMI MONTAŻU ---
        function renderAssemblyDropdownAndManager() {
            const selectEl = document.getElementById('assemblyType');
            const tagsContainer = document.getElementById('assemblyTagsList');
            const currentVal = selectEl.value;
            
            selectEl.innerHTML = '';
            tagsContainer.innerHTML = '';

            assemblyTypes.forEach(type => {
                const opt = document.createElement('option');
                opt.value = type;
                opt.innerText = type;
                selectEl.appendChild(opt);

                const tag = document.createElement('div');
                tag.className = 'tag-pill';
                tag.innerHTML = `<span>${type}</span> <button type="button" onclick="removeAssemblyType('${type}')">&times;</button>`;
                tagsContainer.appendChild(tag);
            });

            if (assemblyTypes.includes(currentVal)) selectEl.value = currentVal;
        }

        function addNewAssemblyType() {
            const input = document.getElementById('newAssemblyInput');
            const val = input.value.trim();
            if (!val) return;
            if (assemblyTypes.includes(val)) {
                alert('Taki rodzaj montażu już istnieje!');
                return;
            }
            assemblyTypes.push(val);
            saveToStorage();
            renderAssemblyDropdownAndManager();
            input.value = '';
            document.getElementById('assemblyType').value = val;
        }

        function removeAssemblyType(type) {
            if (assemblyTypes.length <= 1) {
                alert('Musisz zostawić przynajmniej jeden rodzaj montażu.');
                return;
            }
            if (confirm(`Usunąć rodzaj "${type}"?`)) {
                assemblyTypes = assemblyTypes.filter(t => t !== type);
                saveToStorage();
                renderAssemblyDropdownAndManager();
            }
        }

        // --- ZARZĄDZANIE MONTAŻYSTAMI ---
        function renderFittersDropdownAndManager() {
            const selectEl = document.getElementById('fitter');
            const tagsContainer = document.getElementById('fitterTagsList');
            const currentVal = selectEl.value;
            
            selectEl.innerHTML = '';
            tagsContainer.innerHTML = '';

            fittersList.forEach(fitter => {
                const opt = document.createElement('option');
                opt.value = fitter;
                opt.innerText = fitter;
                selectEl.appendChild(opt);

                const tag = document.createElement('div');
                tag.className = 'tag-pill';
                tag.innerHTML = `<span>${fitter}</span> <button type="button" onclick="removeFitter('${fitter}')">&times;</button>`;
                tagsContainer.appendChild(tag);
            });

            if (fittersList.includes(currentVal)) selectEl.value = currentVal;
        }

        function addNewFitter() {
            const input = document.getElementById('newFitterInput');
            const val = input.value.trim();
            if (!val) return;
            if (fittersList.includes(val)) {
                alert('Taki montażysta już istnieje!');
                return;
            }
            fittersList.push(val);
            saveToStorage();
            renderFittersDropdownAndManager();
            input.value = '';
            document.getElementById('fitter').value = val;
        }

        function removeFitter(fitter) {
            if (fittersList.length <= 1) {
                alert('Musisz zostawić przynajmniej jednego montażystę.');
                return;
            }
            if (confirm(`Usunąć montażystę "${fitter}"?`)) {
                fittersList = fittersList.filter(f => f !== fitter);
                saveToStorage();
                renderFittersDropdownAndManager();
            }
        }

        renderAssemblyDropdownAndManager();
        renderFittersDropdownAndManager();

        function showTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            if (btn) btn.classList.add('active');

            if (tabName === 'list') {
                renderList();
            } else if (tabName === 'excel') {
                renderExcelTable();
            } else if (tabName === 'calendar') {
                renderGridCalendar();
                renderCalendarEvents(selectedCalDateStr);
            }
        }

        document.getElementById('appForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const editId = document.getElementById('editId').value;
            const clientName = document.getElementById('clientName').value;
            const vat = document.querySelector('input[name="vat"]:checked').value;
            const assemblyType = document.getElementById('assemblyType').value;
            const address = document.getElementById('address').value;
            const transNo = document.getElementById('transNo').value;
            const contractNo = document.getElementById('contractNo').value;
            const measureDate = document.getElementById('measureDate').value;
            const orderDateVal = document.getElementById('orderDate').value;
            const remindDateVal = document.getElementById('remindDate').value;
            const fitter = document.getElementById('fitter').value;
            const notes = document.getElementById('notes').value;

            const record = {
                id: editId ? Number(editId) : Date.now(),
                clientName,
                vat,
                assemblyType,
                address,
                transNo,
                contractNo,
                measureDate,
                orderDate: orderDateVal,
                remindDate: remindDateVal,
                fitter,
                notes,
                done: editId ? (database.find(item => item.id == Number(editId))?.done || false) : false
            };

            if (editId) {
                database = database.map(item => item.id === Number(editId) ? record : item);
            } else {
                database.unshift(record);
            }

            saveToStorage();
            resetForm();
            showTab('list', document.querySelectorAll('.nav-btn')[1]);
        });

        function resetForm() {
            document.getElementById('appForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('saveBtn').innerText = 'Zapisz Klienta';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('orderDate').valueAsDate = new Date();
            autoCalculateRemindDate();
            renderAssemblyDropdownAndManager();
            renderFittersDropdownAndManager();
        }

        function editRecord(id) {
            const item = database.find(i => i.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('clientName').value = item.clientName;
            document.querySelector(`input[name="vat"][value="${item.vat}"]`).checked = true;
            document.getElementById('assemblyType').value = item.assemblyType || assemblyTypes[0];
            document.getElementById('address').value = item.address || '';
            document.getElementById('transNo').value = item.transNo || '';
            document.getElementById('contractNo').value = item.contractNo || '';
            document.getElementById('measureDate').value = item.measureDate || '';
            document.getElementById('orderDate').value = item.orderDate || '';
            document.getElementById('remindDate').value = item.remindDate || '';
            document.getElementById('fitter').value = item.fitter || fittersList[0];
            document.getElementById('notes').value = item.notes || '';

            document.getElementById('saveBtn').innerText = 'Zapisz Zmiany';
            document.getElementById('cancelBtn').style.display = 'block';

            showTab('form', document.querySelectorAll('.nav-btn')[0]);
        }

        function toggleDone(id) {
            database = database.map(item => item.id === id ? {...item, done: !item.done} : item);
            saveToStorage();
            renderList();
            if (document.getElementById('tab-excel').classList.contains('active')) renderExcelTable();
            if (document.getElementById('tab-calendar').classList.contains('active')) {
                renderGridCalendar();
                renderCalendarEvents(selectedCalDateStr);
            }
        }

        function deleteRecord(id) {
            if (confirm("Usunąć tego klienta?")) {
                database = database.filter(item => item.id !== id);
                saveToStorage();
                renderList();
                if (document.getElementById('tab-excel').classList.contains('active')) renderExcelTable();
                if (document.getElementById('tab-calendar').classList.contains('active')) {
                    renderGridCalendar();
                    renderCalendarEvents(selectedCalDateStr);
                }
            }
        }

        function applyFilter(filterType, btn) {
            activeFilter = filterType;
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderList();
        }

        function buildCardHtml(item, today) {
            const isOverdue = !item.done && item.remindDate <= today;
            return `
                <div class="client-card vat-${item.vat}">
                    <div class="card-head">
                        <span class="client-title">${item.clientName}</span>
                        <span class="badge badge-${item.vat}">VAT ${item.vat}%</span>
                    </div>

                    <div class="info-grid">
                        ${item.assemblyType ? `<div class="full-width">🛠️ <strong>Rodzaj montażu:</strong> ${item.assemblyType}</div>` : ''}
                        ${item.address ? `<div class="full-width">📍 <strong>Adres:</strong> ${item.address}</div>` : ''}
                        ${item.transNo ? `<div>🔢 <strong>Transakcja:</strong> ${item.transNo}</div>` : ''}
                        ${item.contractNo ? `<div>📄 <strong>Umowa:</strong> ${item.contractNo}</div>` : ''}
                        ${item.measureDate ? `<div>📐 <strong>Pomiar:</strong> ${item.measureDate}</div>` : ''}
                        <div>📅 <strong>Zamówienie:</strong> ${item.orderDate}</div>
                        ${item.fitter ? `<div class="full-width">👷 <strong>Montażysta:</strong> ${item.fitter}</div>` : ''}
                        ${item.notes ? `<div class="full-width">📝 <strong>Uwagi:</strong> ${item.notes}</div>` : ''}
                    </div>

                    <div class="remind-pill ${isOverdue ? 'overdue' : ''}">
                        <span>⏰ Powiadomienie: <strong>${item.remindDate}</strong></span>
                        <span>${item.done ? '✓ Gotowe' : (isOverdue ? '⚠️ SPRAWDŹ!' : 'W trakcie')}</span>
                    </div>

                    <div class="card-actions">
                        <button class="btn-act act-check" onclick="toggleDone(${item.id})">
                            ${item.done ? '✓ Zrobione' : '◯ Odhacz'}
                        </button>
                        <button class="btn-act act-edit" onclick="editRecord(${item.id})">Edytuj</button>
                        <button class="btn-act act-del" onclick="deleteRecord(${item.id})">Usuń</button>
                    </div>
                </div>
            `;
        }

        function renderList() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            const filtered = database.filter(item => {
                if (activeFilter === '8') return item.vat === '8';
                if (activeFilter === '23') return item.vat === '23';
                if (activeFilter === 'pending') return !item.done;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px;">Brak zapisanych klientów.</p>';
                return;
            }

            filtered.forEach(item => {
                container.innerHTML += buildCardHtml(item, today);
            });
        }

        function renderExcelTable() {
            const tbody = document.getElementById('excelTableBody');
            tbody.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            if (database.length === 0) {
                tbody.innerHTML = `<tr><td colspan="13" style="text-align:center; color: var(--text-muted); padding: 20px;">Brak danych w tabeli.</td></tr>`;
                return;
            }

            database.forEach(item => {
                const isOverdue = !item.done && item.remindDate <= today;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span style="font-weight:bold; color:${item.done ? 'var(--vat8-color)' : (isOverdue ? 'var(--alert-text)' : 'var(--vat23-color)')}">${item.done ? '✓ Gotowe' : (isOverdue ? '⚠️ PILNE' : 'W trakcie')}</span></td>
                    <td style="font-weight:bold;">${item.clientName}</td>
                    <td><span class="badge badge-${item.vat}">VAT ${item.vat}%</span></td>
                    <td>${item.assemblyType || '-'}</td>
                    <td>${item.address || '-'}</td>
                    <td>${item.transNo || '-'}</td>
                    <td>${item.contractNo || '-'}</td>
                    <td>${item.measureDate || '-'}</td>
                    <td>${item.orderDate}</td>
                    <td style="${isOverdue ? 'color:var(--alert-text); font-weight:bold;' : ''}">${item.remindDate}</td>
                    <td>${item.fitter || '-'}</td>
                    <td>${item.notes || '-'}</td>
                    <td>
                        <button class="btn-act act-check" style="padding:4px 8px; margin-right:4px;" onclick="toggleDone(${item.id})">Odhacz</button>
                        <button class="btn-act act-edit" style="padding:4px 8px; margin-right:4px;" onclick="editRecord(${item.id})">Edytuj</button>
                        <button class="btn-act act-del" style="padding:4px 8px;" onclick="deleteRecord(${item.id})">Usuń</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function switchCalView(viewType, btn) {
            document.querySelectorAll('.cal-toggle-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (viewType === 'grid') {
                document.getElementById('calViewGrid').style.display = 'block';
                document.getElementById('calViewSingle').style.display = 'none';
            } else {
                document.getElementById('calViewGrid').style.display = 'none';
                document.getElementById('calViewSingle').style.display = 'block';
            }
        }

        function changeMonth(delta) {
            currentCalDate.setMonth(currentCalDate.getMonth() + delta);
            renderGridCalendar();
        }

        function renderGridCalendar() {
            const container = document.getElementById('gridCalendarDaysContainer');
            container.innerHTML = '';

            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();

            const monthNames = ["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"];
            document.getElementById('currentMonthYear').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const todayStr = new Date().toISOString().split('T')[0];

            for (let i = 0; i < firstDayIndex; i++) {
                container.innerHTML += `<div class="grid-day empty"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dayDate = new Date(year, month, day);
                const dayStr = dayDate.toISOString().split('T')[0];

                const matches = database.filter(item => 
                    item.orderDate === dayStr || 
                    item.measureDate === dayStr || 
                    item.remindDate === dayStr
                );

                const isToday = dayStr === todayStr;
                const isSelected = dayStr === selectedCalDateStr;

                let dotsHtml = '';
                if (matches.length > 0) {
                    dotsHtml = '<div class="day-dots">';
                    matches.slice(0, 3).forEach(m => {
                        dotsHtml += `<div class="dot dot-${m.vat}"></div>`;
                    });
                    dotsHtml += '</div>';
                }

                const dayEl = document.createElement('div');
                dayEl.className = `grid-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}`;
                dayEl.innerHTML = `<span>${day}</span>${dotsHtml}`;
                dayEl.onclick = () => {
                    selectedCalDateStr = dayStr;
                    document.getElementById('calendarPicker').value = dayStr;
                    renderGridCalendar();
                    renderCalendarEvents(dayStr);
                };

                container.appendChild(dayEl);
            }
        }

        function renderCalendarEvents(selectedDate) {
            const container = document.getElementById('calendarEventsContainer');
            container.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];

            const matched = database.filter(item => 
                item.orderDate === selectedDate || 
                item.measureDate === selectedDate || 
                item.remindDate === selectedDate
            );

            if (matched.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 20px 0;">Brak zdarzeń dla wybranego dnia (${selectedDate}).</p>`;
                return;
            }

            matched.forEach(item => {
                container.innerHTML += buildCardHtml(item, today);
            });
        }

        renderList();
    </script>
</body>
</html>
